<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04382b">
<title>Batwara · Offline</title>
<style>
  html, body { margin: 0; height: 100%; background: linear-gradient(160deg, #021f17, #04382b 45%, #011510); color: #ecfdf5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0; font-size: 26px; background: linear-gradient(90deg, #fff 30%, #6ee7b7 70%, #fcd34d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; color: rgba(234, 255, 245, .65); max-width: 280px; line-height: 1.5; }
  button { margin-top: 6px; padding: 11px 22px; min-height: 44px; border-radius: 10px; border: 1px solid rgba(110, 231, 183, .4);
    background: linear-gradient(135deg, #10b981, #0d9488 60%, #0f766e); color: #fff; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Batwara</h1>
  <p>You're offline. Balances need a connection, so reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
